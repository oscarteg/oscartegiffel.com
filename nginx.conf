# Included from nginx's http block, so these apply to every vhost below.
# The maps ship 1.5 MB (peaks) and 1.1 MB (villages) of JSON.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types application/json application/javascript text/css text/plain image/svg+xml application/geo+json;

server {
    listen 80;
    server_name oscartegiffel.com www.oscartegiffel.com;

    root /usr/share/nginx/html/site;

    # Static site — only allow GET and HEAD
    if ($request_method !~ ^(GET|HEAD)$) {
        return 444;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    # Standalone maps keep their own viewport and may load map tiles and workers.
    location ~ ^/(village-map|mountain-map)(/|$) {
        try_files $uri $uri/index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://s3.amazonaws.com https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://tiles.openfreemap.org https://s3.amazonaws.com https://tile.openstreetmap.org; frame-src https://www.youtube.com https://player.vimeo.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Uniform 404 response — don't leak path existence
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 'unsafe-inline' matches the style-src stance: Astro inlines its hoisted
    # module scripts (the books shelf filter/sort) into the HTML, and this is a
    # single-author static site with no user input, so the XSS surface is
    # minimal. 'none' here silently blocked every script on the site.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}
